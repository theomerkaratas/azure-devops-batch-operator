version: 2
project_name: azure-devops-batch-operator

builds:
  - id: a22r
    main: ./cmd/a22r
    binary: a22r
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/omerkaratas/azure-devops-go-automations/internal/app.version={{ .Tag }}

# Version-less asset names keep the stable .../releases/latest/download/<asset> URLs working.
archives:
  - id: a22r
    formats: [tar.gz]
    name_template: "a22r_{{ .Os }}_{{ .Arch }}"
    files:
      - config.example.yml
      - config.onprem.example.yml
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

nfpms:
  - id: linux-packages
    ids: [a22r]
    package_name: a22r
    file_name_template: "a22r_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: theomerkaratas
    homepage: https://github.com/theomerkaratas/azure-devops-batch-operator
    maintainer: Omer Karatas
    description: Terminal application for inspecting and updating Azure DevOps classic release pipelines in bulk.
    section: utils
    priority: optional
    bindir: /usr/bin
    formats: [deb, rpm]
    contents:
      - src: config.example.yml
        dst: /usr/share/doc/a22r/config.example.yml
      - src: config.onprem.example.yml
        dst: /usr/share/doc/a22r/config.onprem.example.yml

homebrew_casks:
  - name: a22r
    ids: [a22r]
    binaries: [a22r]
    homepage: https://github.com/theomerkaratas/azure-devops-batch-operator
    description: Inspect and update Azure DevOps classic release pipelines in bulk
    repository:
      owner: theomerkaratas
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: actions@github.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/a22r"]
            config_dir = Pathname.new(ENV["XDG_CONFIG_HOME"] || (Pathname.new(Dir.home)/".config"))/"a22r"
            config_file = config_dir/"config.yml"
            example_file = staged_path/"config.example.yml"
            onprem_example = staged_path/"config.onprem.example.yml"

            config_dir.mkpath
            if !config_file.exist? && example_file.exist?
              FileUtils.cp(example_file, config_file)
              File.chmod(0600, config_file)
            end
            FileUtils.cp(example_file, config_dir/"config.example.yml") if example_file.exist?
            FileUtils.cp(onprem_example, config_dir/"config.onprem.example.yml") if onprem_example.exist?
          end

changelog:
  sort: asc
