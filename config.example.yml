# Copy this file to the platform-specific location shown by `a22r config-path`.
# Keep this file private because Azure DevOps personal access tokens are secrets.
azure_devops_url: "https://dev.azure.com/your-org"

# Used when a command's --level option is omitted: read, read-write, or manage.
default_token: read

tokens:
  read: ""
  read_write: ""
  manage: ""
